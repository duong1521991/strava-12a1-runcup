name: Cập nhật dữ liệu
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update.py
        env:
          STRAVA_COOKIE: ${{ secrets.STRAVA_COOKIE }}
      - name: Commit nếu có thay đổi
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && exit 0
          git commit -m "Cập nhật dữ liệu"
          git push
